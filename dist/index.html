<!DOCTYPE html>
<html lang="en" data-beasties-container>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Tasks</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'surface': {
              '50': '#fafafa',
              '100': '#f5f5f5',
              '200': '#e5e5e5',
              '300': '#d4d4d4',
              '400': '#a3a3a3',
              '500': '#737373',
              '600': '#525252',
              '700': '#404040',
              '800': '#262626',
              '900': '#171717',
              '950': '#0a0a0a',
            },
            'accent': {
              '50': '#fef2f2',
              '100': '#fee2e2',
              '200': '#fecaca',
              '300': '#fca5a5',
              '400': '#f87171',
              '500': '#ef4444',
              '600': '#dc2626',
              '700': '#b91c1c',
              '800': '#991b1b',
              '900': '#7f1d1d',
            }
          },
          animation: {
            'fadeIn': 'fadeIn 0.3s ease-out',
            'slideIn': 'slideIn 0.3s ease-out',
            'slideInRight': 'slideInRight 0.25s ease-out',
            'scaleIn': 'scaleIn 0.2s ease-out',
            'checkmark': 'checkmark 0.3s ease-out',
            'shimmer': 'shimmer 2s infinite',
            'pulse-soft': 'pulseSoft 2s infinite',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            slideIn: {
              '0%': { opacity: '0', transform: 'translateY(-10px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            slideInRight: {
              '0%': { opacity: '0', transform: 'translateX(20px)' },
              '100%': { opacity: '1', transform: 'translateX(0)' },
            },
            scaleIn: {
              '0%': { opacity: '0', transform: 'scale(0.95)' },
              '100%': { opacity: '1', transform: 'scale(1)' },
            },
            checkmark: {
              '0%': { transform: 'scale(0)' },
              '50%': { transform: 'scale(1.2)' },
              '100%': { transform: 'scale(1)' },
            },
            shimmer: {
              '0%': { backgroundPosition: '-200% 0' },
              '100%': { backgroundPosition: '200% 0' },
            },
            pulseSoft: {
              '0%, 100%': { opacity: '1' },
              '50%': { opacity: '0.7' },
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Modern Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    * {
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.1) transparent;
    }

    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Modern Input Styling */
    input:focus,
    textarea:focus {
      outline: none;
      box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.3);
    }

    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(0.8);
      cursor: pointer;
      opacity: 0.6;
      transition: opacity 0.2s;
    }

    input[type="date"]::-webkit-calendar-picker-indicator:hover {
      opacity: 1;
    }

    /* Checkbox Animation */
    .checkbox-animate {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .checkbox-animate:active {
      transform: scale(0.9);
    }

    /* Task Item Hover Effect */
    .task-item {
      transition: all 0.15s ease;
    }

    .task-item:hover {
      background: rgba(255, 255, 255, 0.03);
    }

    /* Button Press Effect */
    .btn-press {
      transition: all 0.1s ease;
    }

    .btn-press:active {
      transform: scale(0.97);
    }

    /* Smooth transitions for all interactive elements */
    button, a, input, textarea, select {
      transition: all 0.15s ease;
    }

    /* Modal Backdrop */
    .modal-backdrop {
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    /* Gradient text */
    .gradient-text {
      background: linear-gradient(135deg, #ef4444 0%, #f97316 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Glass effect */
    .glass {
      background: rgba(30, 30, 30, 0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    /* Priority colors */
    .priority-1 { color: #ef4444; border-color: #ef4444; }
    .priority-2 { color: #f97316; border-color: #f97316; }
    .priority-3 { color: #3b82f6; border-color: #3b82f6; }
    .priority-4 { color: #6b7280; border-color: #6b7280; }

    /* Strikethrough animation */
    .line-through-animate {
      text-decoration: line-through;
      text-decoration-color: currentColor;
    }

    /* Container query support for responsive sidebar */
    .cq-container {
      container-type: inline-size;
      container-name: main;
    }

    /* ---- Nav bar ---- */
    .cq-nav { padding: 0.5rem 0.75rem 0.375rem; }
    @container main (min-width: 500px) { .cq-nav { padding: 0.5rem 1rem 0.375rem; } }

    .cq-nav-inner { gap: 0.25rem; }
    @container main (min-width: 400px) { .cq-nav-inner { gap: 0.375rem; } }
    @container main (min-width: 500px) { .cq-nav-inner { gap: 0.5rem; } }

    .cq-nav-label { display: none; }
    @container main (min-width: 360px) { .cq-nav-label { display: inline; } }

    .cq-nav-label-settings { display: none; }
    @container main (min-width: 400px) { .cq-nav-label-settings { display: inline; } }

    /* ---- Header ---- */
    .cq-header { padding: 1rem 1rem 0.75rem; }
    @container main (min-width: 450px) { .cq-header { padding: 1.5rem 1.5rem 1rem; } }
    @container main (min-width: 768px) { .cq-header { padding: 2rem 2rem 1.5rem; } }

    .cq-title { font-size: 1.25rem; }
    @container main (min-width: 500px) { .cq-title { font-size: 1.5rem; } }
    @container main (min-width: 768px) { .cq-title { font-size: 1.875rem; } }

    .cq-subtitle { font-size: 0.75rem; }
    @container main (min-width: 500px) { .cq-subtitle { font-size: 0.8125rem; } }
    @container main (min-width: 768px) { .cq-subtitle { font-size: 0.875rem; } }

    /* ---- Task list container ---- */
    .cq-task-list-area { padding: 0 0.75rem 1rem; }
    @container main (min-width: 450px) { .cq-task-list-area { padding: 0 1.5rem 1.5rem; } }
    @container main (min-width: 768px) { .cq-task-list-area { padding: 0 2rem 2rem; } }

    /* ---- Task items ---- */
    .cq-task-item { padding: 0.5rem; gap: 0.5rem; border-radius: 0.5rem; }
    @container main (min-width: 450px) { .cq-task-item { padding: 0.625rem; gap: 0.5rem; } }
    @container main (min-width: 768px) { .cq-task-item { padding: 1rem; gap: 1rem; border-radius: 0.75rem; } }

    .cq-task-list-gap { gap: 0.25rem; }
    @container main (min-width: 768px) { .cq-task-list-gap { gap: 0.5rem; } }

    /* ---- Meta info ---- */
    .cq-meta { gap: 0.375rem; margin-top: 0.375rem; flex-wrap: wrap; }
    @container main (min-width: 450px) { .cq-meta { gap: 0.5rem; margin-top: 0.5rem; } }
    @container main (min-width: 768px) { .cq-meta { gap: 0.75rem; margin-top: 0.5rem; flex-wrap: nowrap; } }

    /* ---- Add task area ---- */
    .cq-add-task { margin-bottom: 0.75rem; }
    @container main (min-width: 450px) { .cq-add-task { margin-bottom: 1rem; } }
    @container main (min-width: 768px) { .cq-add-task { margin-bottom: 2rem; } }

    .cq-add-btn { padding: 0.75rem 0; }
    @container main (min-width: 768px) { .cq-add-btn { padding: 1rem 0; } }

    .cq-add-form { padding: 0.75rem; }
    @container main (min-width: 500px) { .cq-add-form { padding: 1.25rem; } }

    /* ---- Empty state ---- */
    .cq-empty { min-height: 200px; padding-bottom: 2rem; }
    @container main (min-width: 450px) { .cq-empty { min-height: 300px; padding-bottom: 3rem; } }
    @container main (min-width: 768px) { .cq-empty { min-height: 400px; padding-bottom: 5rem; } }

    .cq-empty-icon { width: 4rem; height: 4rem; margin-bottom: 1rem; }
    @container main (min-width: 450px) { .cq-empty-icon { width: 5rem; height: 5rem; margin-bottom: 1.25rem; } }
    @container main (min-width: 768px) { .cq-empty-icon { width: 6rem; height: 6rem; margin-bottom: 1.5rem; } }

    /* ---- Sort button label ---- */
    .cq-sort-label { display: none; }
    @container main (min-width: 500px) { .cq-sort-label { display: inline; } }

    /* ---- Sort dropdown ---- */
    .cq-sort-dropdown { width: 10rem; }
    @container main (min-width: 400px) { .cq-sort-dropdown { width: 11rem; } }

    /* ---- Project dropdown ---- */
    .cq-project-dropdown { width: min(14rem, calc(100cqi - 2rem)); }

    /* ---- Settings stats ---- */
    .cq-stats-scroll { max-height: calc(100vh - 10rem); }
    @container main (min-width: 768px) { .cq-stats-scroll { max-height: calc(100vh - 12rem); padding-right: 0.5rem; } }

    /* ---- Stats cards ---- */
    .cq-stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    @container main (min-width: 600px) { .cq-stats-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

    .cq-stats-card { padding: 0.75rem; }
    @container main (min-width: 500px) { .cq-stats-card { padding: 1rem; } }

    .cq-stats-value { font-size: 1.25rem; }
    @container main (min-width: 500px) { .cq-stats-value { font-size: 1.5rem; } }
    @container main (min-width: 768px) { .cq-stats-value { font-size: 1.875rem; } }

    /* ---- Achievements row ---- */
    .cq-achievements { grid-template-columns: 1fr; }
    @container main (min-width: 600px) { .cq-achievements { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

    /* ---- Weekly chart ---- */
    .cq-chart-card { padding: 1rem; }
    @container main (min-width: 500px) { .cq-chart-card { padding: 1.25rem; } }

    /* ---- Task details panel ---- */
    .cq-detail-panel-content { padding: 1rem; }
    @container main (min-width: 768px) { .cq-detail-panel-content { padding: 1.5rem; } }

    .cq-detail-panel-header { padding: 0.75rem 1rem; }
    @container main (min-width: 768px) { .cq-detail-panel-header { padding: 1rem 1.5rem; } }

    .cq-detail-panel-footer { padding: 1rem; }
    @container main (min-width: 768px) { .cq-detail-panel-footer { padding: 1rem 1.5rem; } }

    /* ---- Undo toast ---- */
    .cq-toast { max-width: calc(100cqi - 2rem); padding: 0.75rem 1rem; gap: 0.75rem; }
    @container main (min-width: 500px) { .cq-toast { padding: 0.75rem 1.25rem; gap: 1rem; } }

    /* ---- Keyboard shortcuts modal ---- */
    .cq-modal-shortcuts { width: calc(100cqi - 1.5rem); max-width: 420px; }
    .cq-modal-shortcuts-inner { padding: 1rem; }
    @container main (min-width: 500px) { .cq-modal-shortcuts-inner { padding: 1.5rem; } }

    /* ---- Date picker modal ---- */
    .cq-modal-datepicker { width: calc(100cqi - 1.5rem); max-width: 340px; }

    /* ---- Keyboard hint button ---- */
    .cq-kbd-hint { bottom: 1rem; right: 1rem; }
    @container main (min-width: 500px) { .cq-kbd-hint { bottom: 1.5rem; right: 1.5rem; } }

    /* ---- Settings card padding ---- */
    .cq-settings-card { padding: 1rem; }
    @container main (min-width: 500px) { .cq-settings-card { padding: 1.25rem; } }

    /* ---- Sort button ---- */
    .cq-sort-btn { padding: 0.5rem; }
    @container main (min-width: 500px) { .cq-sort-btn { padding: 0.5rem 1rem; } }
  </style>
