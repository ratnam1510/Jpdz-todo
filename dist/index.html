  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'surface': {
              '50': '#fafafa',
              '100': '#f5f5f5',
              '200': '#e5e5e5',
              '300': '#d4d4d4',
              '400': '#a3a3a3',
              '500': '#737373',
              '600': '#525252',
              '700': '#404040',
              '800': '#262626',
              '900': '#171717',
              '950': '#0a0a0a',
            },
            'accent': {
              '50': '#fef2f2',
              '100': '#fee2e2',
              '200': '#fecaca',
              '300': '#fca5a5',
              '400': '#f87171',
              '500': '#ef4444',
              '600': '#dc2626',
              '700': '#b91c1c',
              '800': '#991b1b',
              '900': '#7f1d1d',
            }
          },
          animation: {
            'fadeIn': 'fadeIn 0.3s ease-out',
            'slideIn': 'slideIn 0.3s ease-out',
            'slideInRight': 'slideInRight 0.25s ease-out',
            'scaleIn': 'scaleIn 0.2s ease-out',
            'checkmark': 'checkmark 0.3s ease-out',
            'shimmer': 'shimmer 2s infinite',
            'pulse-soft': 'pulseSoft 2s infinite',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            slideIn: {
              '0%': { opacity: '0', transform: 'translateY(-10px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            slideInRight: {
              '0%': { opacity: '0', transform: 'translateX(20px)' },
              '100%': { opacity: '1', transform: 'translateX(0)' },
            },
            scaleIn: {
              '0%': { opacity: '0', transform: 'scale(0.95)' },
              '100%': { opacity: '1', transform: 'scale(1)' },
            },
            checkmark: {
              '0%': { transform: 'scale(0)' },
              '50%': { transform: 'scale(1.2)' },
              '100%': { transform: 'scale(1)' },
            },
            shimmer: {
              '0%': { backgroundPosition: '-200% 0' },
              '100%': { backgroundPosition: '200% 0' },
            },
            pulseSoft: {
              '0%, 100%': { opacity: '1' },
              '50%': { opacity: '0.7' },
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Modern Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    * {
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.1) transparent;
    }

    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Modern Input Styling */
    input:focus,
    textarea:focus {
      outline: none;
      box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.3);
    }

    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(0.8);
      cursor: pointer;
      opacity: 0.6;
      transition: opacity 0.2s;
    }

    input[type="date"]::-webkit-calendar-picker-indicator:hover {
      opacity: 1;
    }

    /* Checkbox Animation */
    .checkbox-animate {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .checkbox-animate:active {
      transform: scale(0.9);
    }

    /* Task Item Hover Effect */
    .task-item {
      transition: all 0.15s ease;
    }

    .task-item:hover {
      background: rgba(255, 255, 255, 0.03);
    }

    /* Button Press Effect */
    .btn-press {
      transition: all 0.1s ease;
    }

    .btn-press:active {
      transform: scale(0.97);
    }

    /* Smooth transitions for all interactive elements */
    button, a, input, textarea, select {
      transition: all 0.15s ease;
    }

    /* Modal Backdrop */
    .modal-backdrop {
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    /* Gradient text */
    .gradient-text {
      background: linear-gradient(135deg, #ef4444 0%, #f97316 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Glass effect */
    .glass {
      background: rgba(30, 30, 30, 0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    /* Priority colors */
    .priority-1 { color: #ef4444; border-color: #ef4444; }
    .priority-2 { color: #f97316; border-color: #f97316; }
    .priority-3 { color: #3b82f6; border-color: #3b82f6; }
    .priority-4 { color: #6b7280; border-color: #6b7280; }

    /* Strikethrough animation */
    .line-through-animate {
      text-decoration: line-through;
      text-decoration-color: currentColor;
    }
  </style>
